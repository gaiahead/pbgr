<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PBGR 가치평가 모니터</title>
  <link rel="stylesheet" href="style.css?v=global-cagr-v1-20260804"/>
</head>
<body>

<header>
  <div class="header-left">
    <h1>📊 PBGR 가치평가 모니터</h1>
    <p>Price to Book Growth Ratio · <span id="updated"></span> 기준</p>
  </div>
  <div class="header-right">
    <span class="status-msg" id="status-msg"></span>
    <button class="save-btn saved" id="save-btn" onclick="saveSettings()">✓ 저장됨</button>
  </div>
</header>

<div class="section">
  <div class="section-title">
    <span class="param">
      <span class="param-label">요구수익률</span>
      <span class="param-input-box">
        <input class="req-input" id="req-kr" type="number" step="0.1" value="10">
        <span class="unit">%</span>
      </span>
      <span class="discount-box">
        <span class="discount-label">10년 할인계수</span>
        <span class="discount-hint" id="req-kr-discount">1 / 1.10^10 = 0.386배</span>
      </span>
    </span>
  </div>
  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="col-name">
        <col class="col-marketcap">
        <col class="col-market-eval">
        <col class="col-fairmarketcap">
        <col class="col-pbgr">
        <col class="col-gap">
        <col class="col-price">
        <col class="col-fair">
        <col class="col-equity">
        <col class="col-equity">
        <col class="col-equity">
        <col class="col-shares">
      </colgroup>
      <thead>
        <tr class="group-row">
          <th rowspan="2">종목</th>
          <th rowspan="2">시가총액</th>
          <th rowspan="2" title="괴리율·적정가·PBGR에 적용하는 편집 가능한 10년 자본 CAGR">시장 평가 ✎</th>
          <th rowspan="2">적정 시가총액</th>
          <th rowspan="2">PBGR</th>
          <th rowspan="2">괴리율</th>
          <th rowspan="2">종가</th>
          <th rowspan="2">적정가</th>
          <th class="group-head" colspan="3">자본총계</th>
          <th rowspan="2">주식수</th>
        </tr>
        <tr class="sub-row">
          <th>최근</th>
          <th>현재</th>
          <th>+10년</th>
        </tr>
      </thead>
      <tbody id="kr-body"></tbody>
    </table>
  </div>
</div>

<div class="note">
  PBGR · 적정가 · 괴리율 = 시장 평가 자본 CAGR 기준 &nbsp;|&nbsp;
  시장 평가 초기값 = 현재 종가가 내포한 10년 자본 CAGR, 종목별 수정·초기화 가능 &nbsp;|&nbsp;
  요구수익률·시장 평가 수정 후 <strong style="color:#2563eb">저장</strong> 클릭
</div>

<script src="app.js?v=global-cagr-v1-20260804"></script>
</body>
</html>
