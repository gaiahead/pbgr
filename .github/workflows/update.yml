name: Update PBGR Data

on:
  schedule:
    # 매일 UTC 22:00 (KST 07:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # cache: 'pip'  # requirements.txt 없으면 실패하므로 비활성화

      - name: Install dependencies
        run: |
          pip install yfinance scipy playwright
          playwright install chromium --with-deps

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test valuation engines
        run: |
          python -m unittest -v test_pbgr.py
          node --check app.js
          node test_app.js

      - name: Generate PBGR data
        run: |
          python gen_pbgr_data.py
          python -m json.tool pbgr_data.json >/dev/null

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pbgr_data.json
          git diff --staged --quiet || git commit -m "chore: update pbgr_data.json [$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')]"
          git push
